services:
  bundlesdf:
    image: ${IMAGE:-bundlesdf:latest}
    container_name: bundlesdf
    build:
      # Context is the BundleSDF repo root (one level up from this file)
      context: ..
      dockerfile: docker/Dockerfile
      # Persistent layer cache on host filesystem. Requires the
      # `docker-container` buildx driver (see `docker buildx ls`).
      # Survives daemon restart, `docker builder prune`, and reboots.
      cache_from:
        - type=local,src=/home/yjin/.cache/docker-build/bundlesdf
      # mode=min: only cache final layer, avoid IO write amplification during
      # heavy build steps (OpenCV) that previously froze the host.
      cache_to:
        - type=local,dest=/home/yjin/.cache/docker-build/bundlesdf,mode=min
      args:
        CMAKE_VERSION_MAJOR: "3"
        CMAKE_VERSION_MINOR: "25"
        CMAKE_VERSION_PATCH: "3"
        EIGEN_VERSION_MAJOR: "3"
        EIGEN_VERSION_MINOR: "4"
        EIGEN_VERSION_PATCH: "0"
        OPENCV_VERSION_MAJOR: "4"
        OPENCV_VERSION_MINOR: "11"
        OPENCV_VERSION_PATCH: "0"
        PCL_VERSION_MAJOR: "1"
        PCL_VERSION_MINOR: "10"
        PCL_VERSION_PATCH: "0"
        PYBIND11_VERSION_MAJOR: "2"
        PYBIND11_VERSION_MINOR: "13"
        PYBIND11_VERSION_PATCH: "0"
        YAML_CPP_VERSION_MAJOR: "0"
        YAML_CPP_VERSION_MINOR: "8"
        YAML_CPP_VERSION_PATCH: "0"
        PYTHON_VERSION: "3.10"

    network_mode: host

    # Land in the live-mounted repo for both the main process and `docker exec`
    # (base deepstream image's WORKDIR is /opt/nvidia/deepstream/...).
    working_dir: /workspace/BundleSDF

    stdin_open: true
    tty: true

    privileged: true
    runtime: nvidia

    environment:
      # GPU
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
      # GUI / X11
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      # Build control
      SKIP_BUILD: "${SKIP_BUILD:-0}"

    volumes:
      # X11 forwarding (run `xhost +local:root` on host if blocked)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Live-mount BundleSDF source (edits visible without rebuild)
      - ../:/workspace/BundleSDF:rw
      # HuggingFace cache (avoids re-downloading weights)
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:rw
      # SAM2 checkpoint for scripts/make_masks_sam2.py — kept OUT of the image.
      # Populate once on the host:
      #   mkdir -p .docker_assets/sam2_checkpoints && \
      #   curl -fL https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_small.pt \
      #        -o .docker_assets/sam2_checkpoints/sam2.1_hiera_small.pt
      - ../.docker_assets/sam2_checkpoints:/opt/sam2/checkpoints:ro
      # Persist ZED NEURAL depth model TensorRT optimization (~5 min, once per GPU),
      # so `compose down` + recreate does not re-optimize. Named volume (not bind
      # mount): on first mount Docker copies the image's existing
      # /usr/local/zed/resources contents into the volume, so SDK-shipped files
      # are preserved instead of being shadowed by an empty host dir.
      - zed_resources:/usr/local/zed/resources:rw
      # Datasets / external data (adjust path as needed)
      # - /mnt/data:/mnt/data:ro

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    command: tail -f /dev/null

volumes:
  # ZED NEURAL depth model TensorRT optimization cache (see bundlesdf.volumes).
  zed_resources:
